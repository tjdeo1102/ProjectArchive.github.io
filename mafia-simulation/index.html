<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마피아 마을 · MafiaSimulation</title>
  <link rel="stylesheet" href="TemplateData/cozy-loading.css">
</head>
<body>
  <main id="game-shell">
    <section id="loading-screen" role="status" aria-live="polite">
      <div class="loading-card">
        <span class="eyebrow">COZY VILLAGE · WEB DEMO</span>
        <div class="village-mark" aria-hidden="true"><span>⌂</span><span>✦</span></div>
        <h1>마피아 마을로 가는 길</h1>
        <p id="loading-status">연결을 준비하고 있어요.</p>
        <div class="progress-track" aria-hidden="true"><div id="loading-progress"></div></div>
        <p id="loading-detail">잠시만 기다려 주세요.</p>
        <p class="provider-trust-note">개인 Provider JSON의 API 키는 <strong id="provider-service-host">연결 확인 중</strong>으로 HTTPS 전송됩니다. 모델 확인과 게임 진행에 본인 API 사용량·요금이 발생할 수 있습니다. 새로고침하면 브라우저 설정은 삭제됩니다.</p>
        <button id="retry-button" type="button" hidden>다시 연결하기</button>
      </div>
    </section>
    <div id="unity-container" hidden>
      <canvas id="unity-canvas" tabindex="-1" aria-label="마피아 마을 게임"></canvas>
      <button id="fullscreen-button" type="button" aria-label="전체 화면">⛶</button>
      <button id="settings-button" type="button" hidden>설정 다시 하기</button>
      <a id="provider-sample-link" href="TemplateData/provider-sample.json" download="provider-sample.json">Provider JSON 예시</a>
    </div>
    <div id="unity-warning" role="alert" hidden></div>
  </main>
  <script>
    window.cozyUnityBuild = {
      loaderUrl: "Build/v0.3.3.loader.js",
      config: {
        dataUrl: "Build/v0.3.3.data.unityweb",
        frameworkUrl: "Build/v0.3.3.framework.js.unityweb",
        codeUrl: "Build/v0.3.3.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MafiaSimulation",
        productVersion: "0.3.3",
        showBanner: function (message, type) {
          var warning = document.getElementById("unity-warning");
          warning.textContent = message;
          warning.hidden = false;
          warning.dataset.type = type;
        }
      }
    };
  </script>
  <script src="TemplateData/cozy-bootstrap.js"></script>
</body>
</html>
