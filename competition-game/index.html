<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Chroma Shell WebGL Game">

  <title>Chroma Shell</title>

  <style>
    :root {
      color-scheme: dark;

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0b0d12;
      color: #f4f6fb;
    }

    * {
      box-sizing: border-box;
    }

    /*
      중요

      .build-placeholder의 display:grid 등이
      hidden 속성을 덮어쓰지 못하게 함.
    */
    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;

      margin: 0;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 255, 255, 0.045),
          transparent 34rem
        ),
        #0b0d12;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        28px
        clamp(16px, 3vw, 48px)
        36px;
    }

    /* -----------------------------
       Title
    ----------------------------- */

    .game-title {
      flex: 0 0 auto;

      margin: 2px 0 26px;

      font-size: clamp(28px, 4vw, 48px);
      font-weight: 700;
      line-height: 1;

      letter-spacing: -0.04em;
      text-align: center;
    }

    /* -----------------------------
       Game frame
    ----------------------------- */

    .player-frame {
      position: relative;

      width: min(100%, 1440px);
      aspect-ratio: 16 / 9;

      margin: auto 0;

      overflow: hidden;

      background: #050609;

      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;

      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.42),
        inset 0 0 0 1px rgba(255, 255, 255, 0.025);
    }

    /* -----------------------------
       Unity
    ----------------------------- */

    #unity-container {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;
    }

    #unity-canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: #000;

      outline: none;
    }

    /* -----------------------------
       Loading UI
    ----------------------------- */

    .loading-row {
      position: absolute;

      z-index: 10;

      left: 50%;
      bottom: 24px;

      width: min(360px, calc(100% - 48px));

      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 10px 12px;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;

      background: rgba(10, 12, 17, 0.78);

      backdrop-filter: blur(14px);
    }

    .loading-track {
      flex: 1;

      height: 5px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.1);
    }

    #loading-progress {
      display: block;

      width: 0%;
      height: 100%;

      border-radius: inherit;

      background: #ffffff;

      transition: width 160ms ease;
    }

    #loading-label {
      min-width: 38px;

      margin: 0;

      font-size: 12px;
      font-weight: 600;

      text-align: right;

      color: rgba(255, 255, 255, 0.72);
    }

    /* -----------------------------
       Placeholder
    ----------------------------- */

    .build-placeholder {
      position: absolute;
      inset: 0;

      z-index: 20;

      display: grid;
      place-items: center;

      padding: 24px;

      text-align: center;

      color: rgba(255, 255, 255, 0.48);

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        #050609;

      background-size: 36px 36px;
    }

    .build-placeholder p {
      margin: 0;

      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: 500;

      letter-spacing: 0.02em;
    }

    /* -----------------------------
       Unity Ready
    ----------------------------- */

    /*
      game-loader.js에서

      document.body.classList.add("game-ready");

      실행되면 placeholder와 loading UI를 확실하게 제거.
    */

    body.game-ready #build-placeholder {
      display: none !important;
    }

    body.game-ready .loading-row {
      display: none !important;
    }

    body.game-ready #unity-container {
      display: block !important;
    }

    /* -----------------------------
       Hidden state label
    ----------------------------- */

    .sr-only {
      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);

      white-space: nowrap;

      border: 0;
    }

    /* -----------------------------
       Responsive
    ----------------------------- */

    @media (max-width: 720px) {
      .page {
        padding:
          20px
          12px
          24px;
      }

      .game-title {
        margin-bottom: 20px;
      }

      .player-frame {
        border-radius: 10px;
      }

      .loading-row {
        bottom: 18px;

        width: calc(100% - 36px);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1
      class="game-title"
      id="game-title"
    >
      Chroma Shell
    </h1>


    <div
      class="player-frame"
      id="player-frame"
    >

      <!-- Unity -->
      <div
        id="unity-container"
        hidden
      >

        <canvas
          id="unity-canvas"
          tabindex="-1"
        ></canvas>


        <!-- Loading -->
        <div class="loading-row">

          <div
            class="loading-track"
            aria-hidden="true"
          >
            <span id="loading-progress"></span>
          </div>

          <p id="loading-label">
            0%
          </p>

        </div>

      </div>


      <!-- Build / Loading Placeholder -->
      <div
        class="build-placeholder"
        id="build-placeholder"
      >
        <p>
          Chroma Shell WebGL build will appear here.
        </p>
      </div>

    </div>


    <!-- JS 상태 표시용 -->
    <span
      id="build-state"
      class="sr-only"
    >
      BUILD CHECKING
    </span>

  </main>


  <script src="game-loader.js?v=1"></script>

</body>
</html>
